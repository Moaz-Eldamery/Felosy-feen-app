<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F2F2F7;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;color:#1C1C1E}
.t{padding:60px 20px 4px;font-size:34px;font-weight:700}
.sub{padding:0 20px;color:#6C6C70;font-size:15px}
.card{margin:14px 16px 0;background:#fff;border-radius:12px;padding:14px}
.big{font-size:40px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:5px;height:80px;margin-top:10px}
.bars i{flex:1;background:#0A84FF;border-radius:3px}
.alert{margin:14px 16px 0;background:#FFE5E3;color:#B3261E;border-radius:12px;padding:12px;font-weight:600;font-size:15px}
.list{margin:14px 16px 0;background:#fff;border-radius:12px}
.row{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #E5E5EA;font-size:16px}
.fab{position:absolute;right:20px;bottom:34px;width:60px;height:60px;border-radius:30px;background:#0A84FF;color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="t">Spending</div><div class="sub">November 2026</div>
<div class="card"><div class="sub" style="padding:0">Total</div><div class="big">EGP 6,320</div>
<div class="bars"><i style="height:20%"></i><i style="height:35%"></i><i style="height:10%"></i><i style="height:60%"></i><i style="height:25%"></i><i style="height:45%"></i><i style="height:15%"></i><i style="height:70%"></i><i style="height:30%"></i></div></div>
<div class="alert">Computer Accessories is over budget</div>
<div class="list">
<div class="row"><span>Food &amp; Drinks</span><span>2,850 / 3,500</span></div>
<div class="row"><span>Water</span><span>140 / 300</span></div>
<div class="row"><span>Computer Accessories</span><span>1,200 / 1,000</span></div>
<div class="row"><span>Clothes</span><span>0 / 800</span></div>
<div class="row"><span>Bills</span><span>900 / 1,200</span></div>
<div class="row"><span>Transportation</span><span>760 / 1,500</span></div>
</div>
<div class="fab">+</div>
</body></html>
