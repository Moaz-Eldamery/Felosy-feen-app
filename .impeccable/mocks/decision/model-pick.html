<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#EFE9DA;font-family:'Alegreya Sans',sans-serif;color:#2C3A2E}
.hdr{height:290px;background:#7A8B3C;color:#F5F1E3;padding:58px 20px 0;position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at 85% 30%,rgba(255,255,255,.08) 0 1px,transparent 1px 7px)}
.hdr .m{font-size:15px;font-weight:500;opacity:.9}
.hdr .v{font-size:76px;font-weight:800;line-height:1;margin-top:10px}
.hdr .v small{font-size:22px;font-weight:700;margin-left:6px}
.hdr .s{font-size:15px;margin-top:6px}
.hdr svg{position:absolute;left:20px;bottom:16px}
.warn{margin:12px 16px 0;padding:9px 12px;border-radius:8px;background:#B5523B;color:#fff;font-weight:700;font-size:14px}
.list{margin:10px 16px 0}
.r{display:flex;align-items:center;height:50px;border-bottom:1px solid #D8D0BC;gap:10px}
.r .c{width:10px;height:30px;border-radius:2px}
.r .n{flex:1;font-size:16px;font-weight:500}
.r .a{font-weight:800;font-size:18px}
.r .a span{font-weight:400;font-size:13px;opacity:.7}
.fab{position:absolute;right:20px;bottom:32px;width:64px;height:64px;border-radius:32px;background:#2C3A2E;color:#EFE9DA;font-size:34px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="hdr"><div class="m">November 2026</div><div class="v">6,320<small>EGP</small></div><div class="s">of 8,300 · day 9</div>
<svg width="350" height="70"><polyline points="0,68 35,60 70,50 105,30 140,20" fill="none" stroke="#F5F1E3" stroke-width="2.5"/><line x1="0" y1="68" x2="350" y2="4" stroke="#F5F1E3" stroke-opacity=".5" stroke-dasharray="3 4"/></svg></div>
<div class="warn">Computer accessories over by 200 · Food at 81%</div>
<div class="list">
<div class="r"><div class="c" style="background:#3E6E8E"></div><div class="n">Food &amp; Drinks</div><div class="a">2,850 <span>/ 3,500</span></div></div>
<div class="r"><div class="c" style="background:#5C8F9A"></div><div class="n">Water</div><div class="a">140 <span>/ 300</span></div></div>
<div class="r"><div class="c" style="background:#B5523B"></div><div class="n">Computer accessories</div><div class="a">1,200 <span>/ 1,000</span></div></div>
<div class="r"><div class="c" style="background:#8C6A9E"></div><div class="n">Clothes</div><div class="a">0 <span>/ 800</span></div></div>
<div class="r"><div class="c" style="background:#9A7B4F"></div><div class="n">Bills</div><div class="a">900 <span>/ 1,200</span></div></div>
<div class="r"><div class="c" style="background:#C98B3A"></div><div class="n">Transportation</div><div class="a">760 <span>/ 1,500</span></div></div>
<div class="r"><div class="c" style="background:#7A8B3C"></div><div class="n">Gifts</div><div class="a">350</div></div>
<div class="r"><div class="c" style="background:#6E6A60"></div><div class="n">Others</div><div class="a">120</div></div>
</div>
<div class="fab">+</div>
</body></html>
