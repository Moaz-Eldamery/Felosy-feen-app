<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spending">
  <meta name="theme-color" content="#F2F2F7">
  <script>
    // Apply Settings › Appearance before first paint, and match the status bar to the app's ground.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('spending.theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#F2F2F7');
    })();
  </script>
  <meta name="format-detection" content="telephone=no">
  <title>Spending</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <noscript>Spending needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
